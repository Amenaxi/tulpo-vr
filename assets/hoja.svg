<svg width="360" height="640" viewBox="0 0 360 640" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo transparente -->
  <defs>
    <!-- Contorno sutil -->
    <linearGradient id="leafStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2e7d32" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1b5e20" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Símbolo de hoja reutilizable (simple) -->
    <symbol id="leaf" viewBox="0 0 120 240">
      <path d="M60 10
               C 95 40, 112 90, 108 130
               C 102 175, 80 205, 60 228
               C 40 205, 18 175, 12 130
               C 8 90, 25 40, 60 10 Z"
            fill="#43a047" fill-opacity="0.14"
            stroke="url(#leafStroke)" stroke-width="2"/>
      <path d="M60 22 L60 220" stroke="#2e7d32" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round"/>
      <path d="M60 60 C 82 70, 92 92, 96 110" stroke="#2e7d32" stroke-opacity="0.28" stroke-width="1.4" fill="none"/>
      <path d="M60 92 C 38 102, 28 122, 24 138" stroke="#2e7d32" stroke-opacity="0.26" stroke-width="1.4" fill="none"/>
      <path d="M60 132 C 78 142, 86 162, 88 176" stroke="#2e7d32" stroke-opacity="0.22" stroke-width="1.2" fill="none"/>
    </symbol>
  </defs>

  <!-- Composición pensada para pantalla móvil -->
  <g>
    <!-- cluster superior -->
    <use href="#leaf" x="22"  y="12"  width="92"  height="184" transform="rotate(-10 68 104)" />
    <use href="#leaf" x="95"  y="0"   width="110" height="220" transform="rotate(8 150 110)" opacity="0.95"/>
    <use href="#leaf" x="188" y="20"  width="88"  height="176" transform="rotate(-6 232 108)" opacity="0.9"/>

    <!-- lateral izquierda -->
    <use href="#leaf" x="-10" y="160" width="120" height="240" transform="rotate(-14 50 280)" />
    <use href="#leaf" x="40"  y="240" width="96"  height="192" transform="rotate(6 88 336)" opacity="0.9"/>

    <!-- central -->
    <use href="#leaf" x="128" y="220" width="110" height="220" />
    <use href="#leaf" x="210" y="250" width="98"  height="196" transform="rotate(10 259 348)" opacity="0.92"/>

    <!-- lateral derecha -->
    <use href="#leaf" x="266" y="150" width="115" height="230" transform="rotate(14 324 265)" />
    <use href="#leaf" x="248" y="340" width="105" height="210" transform="rotate(-8 300 445)" opacity="0.9"/>

    <!-- base/suelo decorativo minimal -->
    <path d="M40 600 C 120 580, 240 580, 320 600" stroke="#1b5e20" stroke-opacity="0.10" stroke-width="2" fill="none"/>
    <path d="M60 618 C 150 600, 210 600, 300 618" stroke="#1b5e20" stroke-opacity="0.08" stroke-width="2" fill="none"/>
  </g>
</svg>

